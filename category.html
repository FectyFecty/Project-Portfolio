<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Category</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top portfolio-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html#name"
          >Project Portfolio</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#categoryNavigation"
          aria-controls="categoryNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="categoryNavigation">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="index.html#name">Name</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#projects">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="category-page">
      <section class="section-pad">
        <div class="container">
          <a class="back-link" href="index.html#projects"
            ><i class="bi bi-arrow-left"></i> Back to projects</a
          >
          <div class="section-heading category-heading">
            <p class="eyebrow">Category</p>
            <h1 id="categoryTitle">Portfolio Category</h1>
            <p id="categoryDescription" class="lead intro-copy mb-0"></p>
          </div>

          <div
            id="categoryShowcase"
            class="category-showcase"
            aria-live="polite"
          >
            <div class="showcase-visual">
              <div id="projectImageFrame" class="showcase-image-frame"></div>
            </div>

            <article class="showcase-details">
              <div class="showcase-copy">
                <h2 id="projectTitle"></h2>
                <span id="projectCategory" class="category-pill"></span>
                <p id="projectDescription" class="project-description"></p>
              </div>

              <dl id="projectMeta" class="project-meta"></dl>

              <div id="projectLinksWrap" class="project-links-wrap">
                <div id="projectLinks" class="project-links"></div>
              </div>
            </article>
          </div>

          <div class="carousel-controls" aria-label="Project carousel controls">
            <button id="previousProject" class="carousel-btn" type="button">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
              <span>Previous</span>
            </button>
            <span id="projectCounter" class="project-counter"></span>
            <button id="nextProject" class="carousel-btn" type="button">
              <span>Next</span>
              <i class="bi bi-arrow-right" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
